name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build -c Release

      # A throwaway SFTP server for the SFTP tests (they are skipped when AGSCOPY_SFTP is not set).
      - name: Start an SFTP test server
        run: |
          docker run -d --name sftp -p 2222:22 atmoz/sftp agscopy:Test-Pass-123:1001::upload
          for i in $(seq 1 30); do nc -z 127.0.0.1 2222 && break; sleep 1; done

      - run: dotnet test tests/AgsCopy.Core.Tests -c Release --no-build --logger "console;verbosity=normal"
        env:
          AGSCOPY_SFTP: 127.0.0.1:2222:agscopy:Test-Pass-123:/upload

      - name: SFTP server log
        if: failure()
        run: docker logs sftp

  msi:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes list the commits since the previous tag
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # A v1.2.3 tag is the release version; other builds use Directory.Build.props.
      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$v' is not x.y.z" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build the MSI and the portable exe
        shell: pwsh
        run: build\package.ps1 -Version ${{ steps.version.outputs.version }}

      # Installs the MSI on this runner and checks real runs, shadow copies, NTFS compression,
      # versions, restore and the watchdog. A failure here stops the release.
      - name: End-to-end test on Windows
        shell: pwsh
        run: build\e2e.ps1 -Msi (Get-Item publish\AGS-Copy-*.msi).FullName

      # Kept even when the end-to-end test fails, to try the build by hand.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AGS-Copy-${{ steps.version.outputs.version }}
          path: |
            publish/AGS-Copy-*.msi
            publish/AGS-Copy-Portable-*.exe

      # Releases go to a public repository of their own, so the source can be private while anyone can
      # download the .msi. The app looks there for the latest release and its .msi asset when it starts.
      # RELEASES_TOKEN: a fine-grained token with Contents read and write on that repository only.
      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: stefanozanarini/ags-copy-releases
        run: |
          $previous = git describe --tags --abbrev=0 "$env:GITHUB_REF_NAME^" 2>$null
          $range = if ($previous) { "$previous..$env:GITHUB_REF_NAME" } else { $env:GITHUB_REF_NAME }
          $notes = "## Changes`n`n" + ((git log --no-merges --format='- %s' $range) -join "`n")
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          gh release create $env:GITHUB_REF_NAME (Get-Item publish\AGS-Copy-*.msi).FullName (Get-Item publish\AGS-Copy-Portable-*.exe).FullName `
            --repo $env:RELEASES_REPO --title "AGS-Copy ${{ steps.version.outputs.version }}" --notes-file notes.md

      # Copies older than 0.5.9 look for updates in this repository: while it is public they find the
      # release here too, and with it the version that looks in the releases repository.
      - name: Publish the release here too while this repository is public
        if: github.ref_type == 'tag' && !github.event.repository.private
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-Item publish\AGS-Copy-*.msi).FullName (Get-Item publish\AGS-Copy-Portable-*.exe).FullName --title "AGS-Copy ${{ steps.version.outputs.version }}" --notes-file notes.md
